name: medline_mobile
description: Role-based MedLine medication delivery application.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  file_picker: ^8.0.7
  flutter_secure_storage: ^9.2.2
  url_launcher: ^6.3.1
  geolocator: ^13.0.2
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  path_provider: ^2.1.5
  share_plus: ^12.0.2
  firebase_core: ^3.0.0
  firebase_messaging: ^15.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

openapi: 3.0.3
info:
  title: MedLine API
  version: 1.0.0
  description: Versioned REST contract for the MedLine medication delivery and medical logistics platform.
servers:
  - url: https://api.example.com/api/v1
    description: Production placeholder
  - url: http://127.0.0.1:8000/api/v1
    description: Native local development
tags:
  - name: Health
  - name: Authentication
  - name: Catalog
  - name: Orders
  - name: Procurement
  - name: Deliveries
  - name: Notifications
  - name: Support
  - name: Administration
paths:
  /dashboard:
    get:
      tags: [Administration]
      summary: Return role-scoped dashboard metrics
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /admin/notification-delivery-health:
    get:
      tags: [Administration]
      summary: Return aggregate notification delivery health for the last 24 hours
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /procurement/{procurement}:
    get:
      tags: [Procurement]
      summary: Return an owned or administrator-visible procurement with delivery timeline and warehouse batch choices
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: procurement, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /partner/deliveries:
    get:
      tags: [Deliveries]
      summary: List deliveries owned by a pharmacy or warehouse
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
        - { name: sort_by, in: query, schema: { type: string, enum: [public_id, related_order, delivery_address_snapshot, total, status, created_at] } }
        - { name: sort_direction, in: query, schema: { type: string, enum: [asc, desc] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200': { $ref: '#/components/responses/Paginated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /deliveries/{delivery}:
    get:
      tags: [Deliveries]
      summary: Return a privacy-scoped delivery route, pickup manifest, pricing snapshot, and timeline; eligible drivers may preview available jobs before claiming
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: delivery, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /pharmacy/prescriptions:
    get:
      tags: [Orders]
      summary: List prescriptions awaiting pharmacy review
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: status, in: query, required: false, schema: { type: string, enum: [pending_review, approved, rejected] } }
      responses:
        '200': { $ref: '#/components/responses/Paginated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/users/{user}/role:
    patch:
      tags: [Administration]
      summary: Update a user role with profile safeguards
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: user, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string, enum: [patient, pharmacy, warehouse, driver, admin] }
                reason: { type: string, maxLength: 1000 }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/ratings:
    get:
      tags: [Administration]
      summary: List ratings for moderation
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Paginated' }
  /admin/ratings/{rating}/moderate:
    post:
      tags: [Administration]
      summary: Hide or restore a rating
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: rating, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [hide, restore] }
                reason: { type: string, maxLength: 500 }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /health:
    get:
      tags: [Health]
      security: []
      summary: Liveness check
      responses:
        '200': { description: API process is responding }
  /health/ready:
    get:
      tags: [Health]
      security: []
      summary: Dependency-aware readiness check
      responses:
        '200': { description: Database and storage are ready }
        '503':
          description: One or more dependencies are unavailable
          headers:
            Retry-After:
              description: Seconds before the readiness check should be retried
              schema: { type: integer, example: 30 }
  /auth/register:
    post:
      tags: [Authentication]
      security: []
      summary: Register a patient, pharmacy, warehouse, or driver account
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201': { $ref: '#/components/responses/Success' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /auth/login:
    post:
      tags: [Authentication]
      security: []
      summary: Issue a Sanctum bearer token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
                two_factor_code: { type: string, pattern: '^[0-9]{6}$', description: Required when an administrator has two-factor authentication enabled. }
                transport: { type: string, enum: [bearer, cookie], default: bearer }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /auth/refresh:
    post:
      tags: [Authentication]
      security: []
      summary: Rotate a refresh token
      description: Consumes a single-use refresh token, issues a replacement access token and refresh token, and revokes the superseded refresh token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Supply `refresh_token` for native clients; browser clients may use the HttpOnly refresh cookie.
              properties:
                refresh_token: { type: string, minLength: 40, maxLength: 255 }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /auth/forgot-password:
    post:
      tags: [Authentication]
      security: []
      summary: Request password recovery instructions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /auth/reset-password:
    post:
      tags: [Authentication]
      security: []
      summary: Reset a password with a time-limited token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, token, password, password_confirmation]
              properties:
                email: { type: string, format: email }
                token: { type: string, minLength: 64, maxLength: 64 }
                password: { type: string, format: password, minLength: 8 }
                password_confirmation: { type: string, format: password }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /auth/verify-email:
    get:
      tags: [Authentication]
      security: []
      summary: Verify an email address with a time-limited token
      parameters:
        - name: email
          in: query
          required: true
          schema: { type: string, format: email }
        - name: token
          in: query
          required: true
          schema: { type: string, minLength: 64, maxLength: 64 }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /auth/logout:
    post:
      tags: [Authentication]
      security: [{ bearerAuth: [] }]
      summary: Revoke the current token
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token: { type: string, minLength: 40, maxLength: 255 }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /profile:
    patch:
      tags: [Authentication]
      security: [{ bearerAuth: [] }]
      summary: Update authenticated profile and locale
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string, minLength: 1, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 120 }
                phone: { type: string, maxLength: 32 }
                locale: { type: string, enum: [ar, en] }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /auth/2fa/setup:
    post:
      tags: [Authentication]
      security: [{ bearerAuth: [] }]
      summary: Generate an encrypted administrator TOTP setup secret
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string, minLength: 1, maxLength: 128 }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Conflict' }
  /auth/2fa/status:
    get:
      tags: [Authentication]
      security: [{ bearerAuth: [] }]
      summary: Read administrator TOTP status
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /auth/2fa/confirm:
    post:
      tags: [Authentication]
      security: [{ bearerAuth: [] }]
      summary: Confirm and enable administrator TOTP
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string, minLength: 1, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /auth/2fa/disable:
    post:
      tags: [Authentication]
      security: [{ bearerAuth: [] }]
      summary: Disable administrator TOTP after code confirmation
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string, minLength: 1, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /medicines:
    get:
      tags: [Catalog]
      security: []
      summary: Search the bilingual medicine catalog; partner-scoped results include current unit price and available quantity
      parameters:
        - { $ref: '#/components/parameters/Search' }
        - { $ref: '#/components/parameters/PerPage' }
        - { name: include_inactive, in: query, schema: { type: boolean } }
        - { name: status, in: query, schema: { type: string, enum: [active, inactive] } }
        - { name: prescription_required, in: query, schema: { type: boolean } }
        - { name: sort_by, in: query, schema: { type: string, enum: [name_en, name_ar, manufacturer, form, dosage, code, prescription_required, is_active, created_at] } }
        - { name: sort_direction, in: query, schema: { type: string, enum: [asc, desc] } }
      responses:
        '200': { $ref: '#/components/responses/Paginated' }
    post:
      tags: [Catalog]
      security: [{ bearerAuth: [] }]
      summary: Create a medicine catalog entry as an administrator
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string, minLength: 1, maxLength: 128 }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [name_en, name_ar]
              properties:
                name_en: { type: string }
                name_ar: { type: string }
                manufacturer: { type: string }
                form: { type: string }
                dosage: { type: string }
                code: { type: string }
                category_id: { type: integer }
                prescription_required: { type: boolean }
                image: { type: string, format: binary }
      responses:
        '201': { $ref: '#/components/responses/Success' }
  /medicines/{medicine}:
    get:
      tags: [Catalog]
      security: []
      summary: View a medicine and its safety and availability information
      parameters:
        - { name: medicine, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { $ref: '#/components/responses/Success' }
    patch:
      tags: [Catalog]
      security: [{ bearerAuth: [] }]
      summary: Update a medicine catalog entry
      parameters:
        - name: medicine
          in: path
          required: true
          schema: { type: integer }
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string, minLength: 1, maxLength: 128 }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /medicines/{medicine}/status:
    patch:
      tags: [Catalog]
      security: [{ bearerAuth: [] }]
      summary: Activate or deactivate a medicine catalog entry
      parameters:
        - { name: medicine, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [is_active]
              properties:
                is_active: { type: boolean }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /medicines/import:
    post:
      tags: [Catalog]
      security: [{ bearerAuth: [] }]
      summary: Validate and import a medicine XLSX or CSV spreadsheet as an administrator
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string, minLength: 1, maxLength: 128 }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /medicines/import-template:
    get:
      tags: [Catalog]
      security: [{ bearerAuth: [] }]
      summary: Download an Excel-compatible medicine import template
      responses:
        '200': { description: CSV import template }
  /medicines/export:
    get:
      tags: [Catalog]
      security: [{ bearerAuth: [] }]
      summary: Export the medicine catalog as CSV
      responses:
        '200': { description: CSV catalog export }
  /partners:
    get:
      tags: [Catalog]
      security: []
      summary: List approved pharmacies or warehouses
      parameters:
        - { $ref: '#/components/parameters/Search' }
        - name: type
          in: query
          schema: { type: string, enum: [pharmacy, warehouse] }
      responses:
        '200': { $ref: '#/components/responses/Paginated' }
  /addresses:
    get:
      tags: [Orders]
      security: [{ bearerAuth: [] }]
      summary: List addresses owned by the authenticated user
      responses:
        '200': { $ref: '#/components/responses/Success' }
    post:
      tags: [Orders]
      security: [{ bearerAuth: [] }]
      summary: Create a user-owned delivery address
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Reuse the same key when retrying a timed-out address creation request.
          schema: { type: string, minLength: 1, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label, address_line]
              properties:
                label: { type: string, maxLength: 80 }
                address_line: { type: string, maxLength: 1000 }
                city: { type: string, maxLength: 100 }
                district: { type: string, maxLength: 100 }
                latitude: { type: number, minimum: -90, maximum: 90 }
                longitude: { type: number, minimum: -180, maximum: 180 }
                is_default: { type: boolean }
      responses:
        '201': { $ref: '#/components/responses/Success' }
  /addresses/{address}:
    patch:
      tags: [Orders]
      security: [{ bearerAuth: [] }]
      summary: Update an owned delivery address
      parameters:
        - name: address
          in: path
          required: true
          schema: { type: integer }
        - name: Idempotency-Key
          in: header
          required: false
          description: Reuse the same key when retrying a timed-out address update request.
          schema: { type: string, minLength: 1, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label: { type: string, maxLength: 80 }
                address_line: { type: string, maxLength: 1000 }
                city: { type: string, maxLength: 100 }
                district: { type: string, maxLength: 100 }
                latitude: { type: number, minimum: -90, maximum: 90 }
                longitude: { type: number, minimum: -180, maximum: 180 }
                is_default: { type: boolean }
      responses:
        '200': { $ref: '#/components/responses/Success' }
    delete:
      tags: [Orders]
      security: [{ bearerAuth: [] }]
      summary: Delete an owned delivery address
      parameters:
        - name: address
          in: path
          required: true
          schema: { type: integer }
        - name: Idempotency-Key
          in: header
          required: false
          description: Reuse the same key when retrying a timed-out address deletion request.
          schema: { type: string, minLength: 1, maxLength: 128 }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /orders:
    get:
      tags: [Orders]
      security: [{ bearerAuth: [] }]
      summary: List orders visible to the current role
      responses:
        '200': { $ref: '#/components/responses/Paginated' }
    post:
      tags: [Orders]
      security: [{ bearerAuth: [] }]
      summary: Create a patient order with transactional stock reservation
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string, maxLength: 180 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderRequest' }
      responses:
        '201': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /delivery-pricing/current:
    get:
      tags: [Orders]
      security: [{ bearerAuth: [] }]
      summary: Read the delivery and tax rates currently applied to new patient orders and pharmacy replenishments
      parameters:
        - name: vehicle_type
          in: query
          required: false
          schema: { type: string, enum: [bicycle, motorcycle, car, van], default: motorcycle }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /delivery-pricing/estimate:
    get:
      tags: [Orders]
      security: [{ bearerAuth: [] }]
      summary: Calculate the authoritative driving route, distance, duration, geometry, rate snapshot, and route-based fee
      parameters:
        - { name: from_latitude, in: query, required: true, schema: { type: number, format: double, minimum: -90, maximum: 90 } }
        - { name: from_longitude, in: query, required: true, schema: { type: number, format: double, minimum: -180, maximum: 180 } }
        - { name: to_latitude, in: query, required: true, schema: { type: number, format: double, minimum: -90, maximum: 90 } }
        - { name: to_longitude, in: query, required: true, schema: { type: number, format: double, minimum: -180, maximum: 180 } }
        - { name: vehicle_type, in: query, required: false, schema: { type: string, enum: [bicycle, motorcycle, car, van], default: motorcycle } }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { description: The configured road-routing provider is unavailable or cannot find a driving route }
  /orders/{order}:
    get:
      tags: [Orders]
      security: [{ bearerAuth: [] }]
      summary: View an owned order with delivery timeline, invoice summary, and current-user rating state
      parameters:
        - name: order
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /cart:
    get:
      tags: [Orders]
      security: [{ bearerAuth: [] }]
      summary: Read the authenticated patient's persistent cart
      responses:
        '200': { $ref: '#/components/responses/Success' }
    delete:
      tags: [Orders]
      security: [{ bearerAuth: [] }]
      summary: Clear the authenticated patient's cart
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /cart/items:
    put:
      tags: [Orders]
      security: [{ bearerAuth: [] }]
      summary: Add or update one persistent cart item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [medicine_id, quantity]
              properties:
                medicine_id: { type: integer }
                quantity: { type: integer, minimum: 0, maximum: 100 }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /orders/{order}/rating:
    post:
      tags: [Orders]
      security: [{ bearerAuth: [] }]
      summary: Rate a completed order once
      parameters:
        - { $ref: '#/components/parameters/OrderId' }
        - name: Idempotency-Key
          in: header
          required: false
          description: Reuse the same key when retrying the same partner decision after a timeout.
          schema: { type: string, minLength: 1, maxLength: 128 }
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9._:-]+$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [score]
              properties:
                score: { type: integer, minimum: 1, maximum: 5 }
                comment: { type: string, maxLength: 2000 }
      responses:
        '201': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Conflict' }
  /orders/{order}/cancel:
    post:
      tags: [Orders]
      security: [{ bearerAuth: [] }]
      summary: Cancel an eligible patient order and release reservations
      parameters:
        - { $ref: '#/components/parameters/OrderId' }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 1000 }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Conflict' }
  /orders/{order}/prescription:
    post:
      tags: [Orders]
      security: [{ bearerAuth: [] }]
      summary: Upload a private prescription for a patient order
      parameters:
        - { $ref: '#/components/parameters/OrderId' }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [prescription]
              properties:
                prescription: { type: string, format: binary }
      responses:
        '201': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /partner/orders:
    get:
      tags: [Orders]
      security: [{ bearerAuth: [] }]
      summary: List pharmacy orders
      responses:
        '200': { $ref: '#/components/responses/Paginated' }
  /partner/orders/{order}/decision:
    post:
      tags: [Orders]
      security: [{ bearerAuth: [] }]
      summary: Accept, reject, or partially accept a pharmacy order

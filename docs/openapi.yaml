      responses:
        '200': { description: Signed URL ticket }
        '403': { $ref: '#/components/responses/Forbidden' }
  /complaints/{complaint}/attachments/{attachment}/download-signed:
    get:
      tags: [Support]
      summary: Download complaint evidence with a valid signature
      security: []
      parameters:
        - { name: complaint, in: path, required: true, schema: { type: integer } }
        - { name: attachment, in: path, required: true, schema: { type: integer } }
        - { name: expires, in: query, required: true, schema: { type: integer } }
        - { name: signature, in: query, required: true, schema: { type: string } }
      responses:
        '200': { description: Private evidence file }
        '403': { description: Invalid or expired signature }
  /admin/reports/complaints:
    get:
      tags: [Administration]
      summary: Complaint status, category, priority, and recent-volume report
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Complaint reporting aggregates }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/audit-logs:
    get:
      tags: [Administration]
      security: [{ bearerAuth: [] }]
      summary: Search administrator audit records
      parameters:
        - { $ref: '#/components/parameters/Search' }
        - { $ref: '#/components/parameters/PerPage' }
      responses:
        '200': { $ref: '#/components/responses/Paginated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/delivery-pricing:
    get:
      tags: [Administration]
      security: [{ bearerAuth: [] }]
      summary: Read current rates for every vehicle type and their immutable pricing history
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Administration]
      security: [{ bearerAuth: [] }]
      summary: Create a vehicle-specific delivery-rate version for future orders
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rate_per_km, reason]
              properties:
                vehicle_type: { type: string, enum: [bicycle, motorcycle, car, van], default: motorcycle }
                rate_per_km: { type: number, minimum: 0.01, maximum: 1000000 }
                reason: { type: string, minLength: 5, maxLength: 1000 }
      responses:
        '201': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
  parameters:
    Search:
      name: search
      in: query
      schema: { type: string, maxLength: 120 }
    PerPage:
      name: per_page
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    OrderId:
      name: order
      in: path
      required: true
      schema: { type: integer }
    DeliveryId:
      name: delivery
      in: path
      required: true
      schema: { type: integer }
  schemas:
    RegisterRequest:
      type: object
      required: [name, email, password, password_confirmation, role]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        email: { type: string, format: email }
        phone: { type: string, maxLength: 32 }
        password: { type: string, format: password, minLength: 8 }
        password_confirmation: { type: string, format: password }
        role: { type: string, enum: [patient, pharmacy, warehouse, driver] }
        business_name: { type: string, maxLength: 180 }
        transport: { type: string, enum: [bearer, cookie], default: bearer }
    OrderRequest:
      type: object
      required: [pharmacy_id, items]
      properties:
        pharmacy_id: { type: integer }
        address_id: { type: integer }
        delivery_address_snapshot: { type: string, maxLength: 1000 }
        delivery_latitude: { type: number, minimum: -90, maximum: 90 }
        delivery_longitude: { type: number, minimum: -180, maximum: 180 }
        delivery_preference: { type: string, enum: [asap, scheduled], default: asap }
        delivery_vehicle_type: { type: string, enum: [bicycle, motorcycle, car, van], default: motorcycle }
        scheduled_delivery_at:
          type: string
          format: date-time
          nullable: true
          description: Required and must be in the future when delivery_preference is scheduled.
        patient_note: { type: string, maxLength: 1000 }
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [medicine_id, quantity]
            properties:
              medicine_id: { type: integer }
              quantity: { type: integer, minimum: 1, maximum: 100 }
    DecisionRequest:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [accept, reject, partial] }
        items:
          type: array
          items:
            type: object
            required: [id, accepted_quantity]
            properties:
              id: { type: integer }
              accepted_quantity: { type: integer, minimum: 0 }
              batches:
                type: array
                description: Required for a warehouse procurement acceptance. Quantities must total accepted_quantity.
                items:
                  type: object
                  required: [inventory_id, quantity]
                  properties:
                    inventory_id: { type: integer, description: Warehouse inventory batch identifier. }
                    quantity: { type: integer, minimum: 1 }
        note:
          type: string
          minLength: 5
          maxLength: 1000
          description: Required when partially approving or rejecting an order.
    InventoryRequest:
      type: object
      required: [medicine_id, quantity, unit_price]
      properties:
        medicine_id: { type: integer }
        quantity: { type: integer, minimum: 0, description: Warehouse batch submissions require at least one unit. }
        unit_price: { type: number, minimum: 0 }
        low_stock_threshold: { type: integer, minimum: 0 }
        batch_number: { type: string, maxLength: 100, nullable: true }
        manufactured_at: { type: string, format: date, nullable: true }
        expires_at: { type: string, format: date, nullable: true, description: Must be later than today. }
        received_at: { type: string, format: date, nullable: true }
        storage_location: { type: string, maxLength: 150, nullable: true }
    ProcurementRequest:
      type: object
      required: [warehouse_id, items]
      properties:
        warehouse_id: { type: integer }
        delivery_address_snapshot:
          type: string
          maxLength: 1000
          description: Optional override. When omitted, the pharmacy's registered address is recorded.
        delivery_preference: { type: string, enum: [asap, scheduled], default: asap }
        delivery_vehicle_type: { type: string, enum: [bicycle, motorcycle, car, van], default: motorcycle }
        scheduled_delivery_at:
          type: string
          format: date-time
          nullable: true
          description: Required and must be in the future when delivery_preference is scheduled.
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [medicine_id, quantity]
            properties:
              medicine_id: { type: integer }
              quantity: { type: integer, minimum: 1, maximum: 10000 }
    Error:
      type: object
      required: [message, code]
      properties:
        message: { type: string }
        code: { type: string }
        errors: { type: object, additionalProperties: true }
  responses:
    Success:
      description: Successful operation
      content:
        application/json: { schema: { type: object, additionalProperties: true } }
    Paginated:
      description: Paginated result
      content:
        application/json: { schema: { type: object, additionalProperties: true } }
    ValidationError:
      description: Validation failed
      content:
        application/json: { schema: { $ref: '#/components/schemas/Error' } }
    Unauthorized:
      description: Authentication required
    Forbidden:
      description: Authorization failed
    Conflict:
      description: Conflict or idempotency violation
      headers:
        Retry-After:
          description: Seconds to wait before retrying an in-progress idempotent request
          schema: { type: integer }
        Idempotency-Replayed:
          description: Indicates that the response was replayed from a completed idempotent request
          schema: { type: string, enum: ['true'] }

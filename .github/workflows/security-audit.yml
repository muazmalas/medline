name: MedLine dependency audit

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'
  pull_request:
    paths:
      - 'api/composer.json'
      - 'api/composer.lock'
      - 'web/package.json'
      - 'web/package-lock.json'
      - 'mobile/pubspec.yaml'
      - 'mobile/pubspec.lock'

permissions:
  contents: read

concurrency:
  group: medline-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: Composer, npm, and Flutter dependency audit
    runs-on: ubuntu-24.04
    env:
      MAKEFLAGS: -j4
      CMAKE_BUILD_PARALLEL_LEVEL: '4'
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, bcmath, intl
          coverage: none
          tools: composer:v2

      - name: Audit locked Composer dependencies
        working-directory: api
        run: composer audit --locked --no-interaction

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked React dependencies
        working-directory: web
        run: npm ci --ignore-scripts

      - name: Audit production npm dependencies
        working-directory: web
        run: npm audit --omit=dev --audit-level=high

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve locked Flutter dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Report Flutter dependency graph
        working-directory: mobile
        run: flutter pub deps --style=compact

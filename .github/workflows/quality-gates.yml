name: MedLine quality gates

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: medline-quality-${{ github.ref }}
  cancel-in-progress: true

env:
  MAKEFLAGS: -j4
  CMAKE_BUILD_PARALLEL_LEVEL: '4'

jobs:
  backend:
    name: Laravel quality gates
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, bcmath, intl
          coverage: none
          tools: composer:v2

      - name: Set up MySQL without containers
        shell: bash
        run: |
          sudo systemctl start mysql
          sudo mysql -e "ALTER USER 'root'@'localhost' IDENTIFIED WITH mysql_native_password BY 'root'; FLUSH PRIVILEGES;"
          mysql --protocol=tcp -uroot -proot -e "CREATE DATABASE IF NOT EXISTS medline_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"

      - name: Install Laravel dependencies
        working-directory: api
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Validate Laravel package metadata
        working-directory: api
        run: composer validate --strict

      - name: Rehearse Laravel migrations on disposable MySQL
        working-directory: api
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_DATABASE: medline_test
          DB_USERNAME: root
          DB_PASSWORD: root
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
        run: |
          cp .env.example .env
          php artisan migrate --force

      - name: Check Laravel formatting
        working-directory: api
        run: vendor/bin/pint --test

      - name: Run Laravel test suite
        working-directory: api
        run: php artisan test --without-tty

  web:
    name: React quality gates
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install React dependencies
        working-directory: web
        run: npm ci

      - name: Build React production bundle
        working-directory: web
        run: npm run build

  mobile:
    name: Flutter quality gates
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze Flutter source
        working-directory: mobile
        run: flutter analyze

      - name: Run Flutter tests
        working-directory: mobile
        run: flutter test
